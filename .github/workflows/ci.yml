name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Browser and D1 tests
        run: PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" npm test
      - run: npm run db:migrate:local
      - run: npm run db:migrate:local
      - run: npm exec -- wrangler deploy --dry-run
